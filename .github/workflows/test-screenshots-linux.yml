name: JsHarmonyTutorials Screenhot Tests Linux

on:
  push:
    branches: [ "master", "actions" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-screenshots:

    runs-on: unbuntu-latest

    strategy:
      matrix:
        #node-version: [18.x, 20.x, 22.x]
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Create tutorial shell
      run: |
        mkdir jsh-tutorial-shell
        cd jsh-tutorial-shell
        npx jsharmony-cli create tutorials
    - name: Modify config file
      run: sed 's/image-sharp/image-magick/' app.config.local.js | sed 's/\/\/configTutorials/configTutorials/' > app.config.local.js
    - run: npm run test-screenshots
